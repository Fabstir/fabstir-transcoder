# =============================================================================
# Fabstir Transcoder — Production Docker Compose Reference
# =============================================================================
# Reference configuration for integrating the transcoder as a sidecar service.
# Adapt env vars and volumes to your deployment.
#
# Image: ewr.vultrcr.com/fabstir/transcoder:{sha}
# REST API: port 8000 (JWT-authenticated)
# gRPC API: port 50051, off unless GRPC_ENABLED=true. It has no token check.
# Health: GET http://localhost:8000/health (unauthenticated, returns {"status":"ok"})
#
# REST Endpoints:
#   POST /transcode?source_cid=...&media_formats=...&is_encrypted=...&is_gpu=...
#   POST /transcode/{task_id}/cancel
#   GET  /get_transcoded/{task_id}
#        Response: { "status_code": 200, "metadata": "...", "progress": 0-100, "duration": <seconds> }
#        Any non-200 status_code = job failed permanently, or the server doesn't know
#        it (404, e.g. after a restart); metadata = the reason. progress 100 = finished.
# =============================================================================

services:
  transcoder:
    image: ewr.vultrcr.com/fabstir/transcoder:${TRANSCODER_IMAGE_SHA:?Set TRANSCODER_IMAGE_SHA}
    restart: unless-stopped

    # Reached over the Docker network, and not published on the host: REST has no TLS,
    # and its traffic carries CIDs that contain decryption keys.
    expose:
      - "8000"

    # Locked down, so that a malicious video exploiting FFmpeg gets as little as
    # possible. Existing volumes must be writable by this UID, once:
    #   docker run --rm -v transcoder-downloads:/d -v transcoder-output:/o busybox chown -R 1000:1000 /d /o
    # If they aren't, the server exits at startup and names the path.
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0

    environment:
      # -- S5 / Storage --
      PORTAL_URL: ${PORTAL_URL:?Required}              # S5 gateway URL
      PORTAL_ENCRYPT_URL: ${PORTAL_ENCRYPT_URL:-}       # S5 encrypted gateway URL (if using encryption)
      TOKEN: ${S5_TOKEN:?Required}                      # S5 authentication token

      # -- IPFS (optional, for ipfs:// CIDs) --
      IPFS_GATEWAY: ${IPFS_GATEWAY:-}                   # IPFS gateway URL

      # -- File paths (container-internal) --
      PATH_TO_FILE: /data/downloads/                     # Temp dir for downloaded source files
      PATH_TO_TRANSCODED_FILE: /data/transcoded/         # Temp dir for transcoded output files

      # -- Transcoding config --
      MEDIA_FORMATS_FILE: /config/video_formats.json     # Path to video format definitions

      # -- Cache / garbage collection --
      FILE_SIZE_THRESHOLD: ${FILE_SIZE_THRESHOLD:-1000000000}                 # Source cache cleanup threshold (bytes, default 1GB)
      TRANSCODED_FILE_SIZE_THRESHOLD: ${TRANSCODED_FILE_SIZE_THRESHOLD:-1000000000}  # Transcoded cache threshold (bytes, default 1GB)
      GARBAGE_COLLECTOR_INTERVAL: ${GARBAGE_COLLECTOR_INTERVAL:-3600}         # Cache cleanup interval (seconds, default 1h)

      # -- Stuck jobs (optional; these are the defaults, and 0 turns either limit off) --
      # FFMPEG_STALL_TIMEOUT_SECS: 900   # Kill FFmpeg once its media clock has not moved for this long
      # JOB_DEADLINE_SECS: 86400         # Stop a job this long after it got a slot. Keep it above your longest real job
      # JOB_RECORD_TTL_SECS: 86400       # How long a finished job's result stays available. Results can contain keys, so keep it short
      # GRPC_ENABLED: "true"             # Turns on gRPC on 50051, which has no token check

      # -- Authentication --
      FABSTIR_TRANSCODER_JWT: ${FABSTIR_TRANSCODER_JWT:?Required}            # JWT token for API authentication
      FABSTIR_TRANSCODER_SECRET_KEY: ${FABSTIR_TRANSCODER_SECRET_KEY:?Required}  # Secret key for JWT verification

      # -- Content-moderation publish gate (WP-T) --
      # Unset/`off` = today's behaviour exactly: no keyframe tap, no POST, no
      # gate. Deploying this image with the gate off is a no-op for transcodes,
      # so the image can land ahead of flipping dark.
      #
      # Ladder: off -> dark (tap + POST + verdict recorded, publishes anyway)
      #            -> enforce (publish only on a `cleared` verdict).
      # An unrecognised value is BOOT-FATAL: the container exits(1) naming the
      # bad value, before either listener binds, so a typo is a crash-loop at
      # deploy time rather than a silently disarmed gate.
      MODERATION_GATE: ${MODERATION_GATE:-off}

      # Node base URL for POST /v1/moderate/frames. Required once armed.
      MODERATION_NODE_URL: ${MODERATION_NODE_URL:-}

      # Shared secret, sent as the `ingestToken` BODY field (never a header).
      # Must match the node's value exactly. Unset while armed => the node 401s
      # every call => every job holds, with one named ALERT per job.
      MODERATION_INGEST_TOKEN: ${MODERATION_INGEST_TOKEN:-}

      # Optional knobs — defaults are the agreed Q7 numbers; leave unset unless
      # there is a measured reason. Sampling floor 2s, cap 12s, budget 1000
      # keyframes; frames POST deadline 30s PER BATCH (the sample is split into
      # batches of <=200 keyframes and <=12 MiB raw PNG to stay under the node's
      # 20 MiB body cap).
      # MODERATION_FRAMES_TIMEOUT_SECS: 30
      # MODERATION_SAMPLE_INTERVAL_SECS: 2.0
      # MODERATION_MAX_INTERVAL_SECS: 12.0
      # MODERATION_KEYFRAME_MAX: 1000

      # NOT the same switch: MODERATION_ENABLED is the M3 shadow-sidecar
      # invocation flag and needs that sidecar deployed. Leave it unset here.

      # -- GPU (optional) --
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}

    volumes:
      # Temp storage for source downloads and transcoded files. These hold decrypted
      # content during a job, so put them on a disk encrypted with a random key at each
      # boot if you can (see "Protecting Content on the Host" in docs/API.md).
      - transcoder-downloads:/data/downloads
      - transcoder-output:/data/transcoded

      # Video format config (mount your custom formats file here)
      - ./config/video_formats.json:/config/video_formats.json:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    # Uncomment for GPU acceleration (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  transcoder-downloads:
  transcoder-output:
